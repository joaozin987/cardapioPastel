<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&A Lanche's - Pedidos</title>
<style>
:root{--bg:#faf3e0;--card:#fffdf6;--ink:#1c1a17;--mut:#7d705a;--gold:#e0a21b;--gold2:#b97d00;--line:#eadfc2;--ok:#2f7d4f;--red:#b8321f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#252119;--ink:#f6ecd6;--mut:#b3a68c;--line:#3a3326;--red:#ff7a63;--ok:#62c48d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
header{background:#1c1a17;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--gold)}
header img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold)}
header h1{margin:0;font-size:20px;line-height:1.1}header small{color:var(--gold);font-weight:700}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;white-space:nowrap;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#1c1a17}
main{max-width:1000px;margin:0 auto;padding:14px 14px 120px}
.view{display:none}.view.on{display:block}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.cats button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:800;font-size:15px;cursor:pointer}
.cats button.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.item{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px}
.item.has{border-color:var(--gold);background:var(--line)}
.item b{font-size:16px}.item>span{color:var(--gold2);font-weight:800}
.st{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.st button{width:46px;height:46px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:26px;font-weight:800;cursor:pointer}
.st button.p{background:var(--gold);border-color:var(--gold);color:#1c1a17}.st button:disabled{opacity:.3}.st b{font-size:22px}
.stk{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px}.stk.ok{background:#dff0e4;color:#1f6b3f}.stk.lo{background:#fdeccb;color:#8a5a00}.stk.no{background:#f9d9d3;color:#a32a17}.ct{font-size:11px;font-weight:800;color:var(--gold2);text-transform:uppercase;letter-spacing:.6px}.ds{font-size:13px;color:var(--mut);margin:4px 0 8px;line-height:1.3}.pv{font-size:21px;font-weight:800;color:var(--gold2);margin-bottom:4px}.item{min-height:190px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1c1a17;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--gold)}
.bar b{color:var(--gold);font-size:20px}
.bar button,.btn{background:var(--gold);color:#1c1a17;border:0;border-radius:10px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer}
.bar button:disabled{opacity:.35}
dialog{border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);width:min(460px,94vw);max-height:92vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;font-size:18px;cursor:pointer}
input[type=text],select{width:100%;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
.btn{width:100%;margin-top:10px}.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}.btn.dg{background:transparent;color:var(--red);border:2px solid var(--red)}
.empty{color:var(--mut);padding:36px 0;text-align:center}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sc{background:#1c1a17;color:#fff;border-radius:12px;padding:12px;border-bottom:4px solid var(--gold)}.sc small{color:var(--gold);font-weight:800;display:block}.sc b{display:block;font-size:19px;margin:2px 0}.sc span{color:#d9cfb8;font-weight:700;font-size:14px}
.dh{display:flex;justify-content:space-between;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;margin-top:14px;font-weight:800;font-size:14px}
.rp{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;margin-left:6px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}.pc.off{opacity:.55}
.pc small{color:var(--mut);font-weight:700}.pc .pr{color:var(--gold2);font-weight:800;font-size:18px}
.pc .ed{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:9px;font-weight:800;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.sw input{width:22px;height:22px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;display:none;z-index:99}
header{background:linear-gradient(135deg,#1c1a17,#33291a)}
.hs{display:none!important}
.tabs button{border:none;background:var(--card);box-shadow:0 1px 5px rgba(60,40,0,.15);border-radius:12px;padding:12px}.tabs button.on{background:var(--gold);box-shadow:0 3px 10px #e0a21b66}
#sr{border-radius:14px;padding:14px;margin:0 0 12px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 5px rgba(60,40,0,.08)}
.cats button{display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(60,40,0,.1)}
.item{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:20px;padding:14px;gap:8px;box-shadow:0 2px 12px rgba(60,40,0,.09);transition:transform .15s,box-shadow .15s;min-height:250px}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(60,40,0,.18)}
.item.has{border:2px solid var(--gold);background:var(--card);box-shadow:0 0 0 4px #e0a21b33}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.tile{width:100px;height:100px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;flex:none}
.tile img{width:100%;height:100%;object-fit:cover}
.image-control{margin:8px 0}.image-control label{display:block;font-weight:800}.image-control input[type=file]{width:100%;margin:8px 0;color:var(--ink)}.image-control small{display:block;color:var(--mut)}.image-preview{width:110px;height:110px;margin-top:8px;border:1px dashed var(--mut);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}.image-preview img{width:100%;height:100%;object-fit:cover;display:none}
.pc-thumb{width:80px;height:80px;object-fit:cover;border-radius:12px}
.pv{background:#1c1a17;color:var(--gold);padding:6px 12px;border-radius:99px;font-size:16px;margin:0}
.item .ds{min-height:34px;margin:4px 0 6px}
.bar{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:18px;border:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
dialog{border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
header{flex-wrap:wrap}.pbtn{border:2px solid var(--gold);color:var(--gold);background:transparent;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;cursor:pointer;min-height:44px}.pbtn.on{background:var(--gold);color:#1c1a17}
header{position:relative}#pb{position:absolute;left:50%;transform:translateX(-50%)}
@media(max-width:680px){header{display:grid!important;grid-template-columns:52px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;row-gap:10px}header>img{grid-column:1;grid-row:1}header>div:not(.hs):not(.auth-badge){grid-column:2;grid-row:1}header>.auth-badge{grid-column:3;grid-row:1}#pb{position:static;grid-column:1/-1;grid-row:2;justify-self:center;transform:none}}
@media(min-width:681px) and (max-width:900px){header{display:grid!important;grid-template-columns:52px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:10px}header>img{grid-column:1;grid-row:1}header>div:not(.hs):not(.auth-badge){grid-column:2;grid-row:1}header>.auth-badge{grid-column:3;grid-row:1}#pb{position:static;grid-column:1/-1;grid-row:2;justify-self:center;transform:none}}
@media(max-width:680px){

header>.auth-badge span{max-width:96px;overflow-wrap:anywhere}
.tabs{gap:8px;padding:8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;min-height:48px;padding:10px 14px}

.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{min-width:0;min-height:0;padding:9px;gap:6px;border-radius:14px}
.item .top{align-items:center;gap:6px}
.item .tile{width:54px;height:54px;border-radius:11px;font-size:26px}
.item .pv{font-size:13px;padding:5px 7px;white-space:nowrap}
.item b{font-size:14px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.item .ds{display:-webkit-box;min-height:0;margin:0;font-size:11px;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}

.dh{flex-wrap:wrap;gap:4px 10px}
.oc .row{flex-wrap:wrap;align-items:flex-start}
.oc .row>span:first-child{min-width:0;flex:1 1 100%;overflow-wrap:anywhere}
.oc .row>span:last-child{display:flex;align-items:center;gap:8px;max-width:100%;margin-left:auto}
.rp{margin-left:0}
.dt .dl{align-items:flex-start;flex-wrap:wrap;overflow-wrap:anywhere}

.bar>div{min-width:0}
.bar b{font-size:18px}
.bar button{min-height:48px;padding:10px 12px;font-size:14px}
dialog{width:min(460px,calc(100vw - 20px));max-height:92vh;max-height:92dvh;padding:14px;overflow-y:auto}
.pc{min-width:0}
}
@media(max-width:380px){
header{grid-template-columns:44px minmax(0,1fr) auto}
header img{width:44px;height:44px}
header>.auth-badge{flex-direction:column;align-items:flex-end;font-size:12px}
.item{padding:8px}
.item .tile{width:46px;height:46px;font-size:23px}
.item .pv{font-size:12px;padding:5px 6px}
.bar{align-items:stretch}
.bar button{max-width:58%;line-height:1.2}
.oc .row>span:last-child{width:100%;justify-content:space-between;margin-left:0}
}
@media(min-width:420px) and (max-width:680px){
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.item{padding:8px}
.item .top{align-items:flex-start;flex-direction:column}
.item .tile{width:48px;height:48px;font-size:24px}
}
@media(min-width:681px) and (max-width:900px){
main{padding-left:18px;padding-right:18px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sums{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}
@media(min-width:901px){
#grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@supports not (display:grid){
@media(max-width:680px){
.grid{display:flex;flex-wrap:wrap;margin:-4px}
.grid>.item{width:calc(50% - 8px);margin:4px}
}
@media(min-width:420px) and (max-width:680px){
.grid>.item{width:calc(33.333% - 8px)}
}
@media(min-width:681px) and (max-width:900px){
.grid{display:flex;flex-wrap:wrap;margin:-6px}
.grid>.item{width:calc(33.333% - 12px);margin:6px}
}
@media(min-width:901px){
#grid{display:flex;flex-wrap:wrap;margin:-7px}
#grid>.item{width:calc(25% - 14px);margin:7px}
}
@media(max-width:900px){
header{display:flex!important;flex-wrap:wrap;align-items:center}
header>img{flex:0 0 52px}
header>div:not(.hs):not(.auth-badge){flex:1 1 120px;min-width:0}
header>.auth-badge{flex:0 0 auto}
#pb{position:static;transform:none;margin:0 auto}
}
@media(max-width:680px){
header>img{flex-basis:44px;width:44px;height:44px}
header>div:not(.hs):not(.auth-badge){flex:1 1 80px}
header>.auth-badge{max-width:84px;gap:4px}
}
}
.hint{background:var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:12px}
.refresh-data{width:100%;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.refresh-data:disabled{opacity:.65;cursor:wait}
.oc{border-bottom:1px dashed var(--line)}.oc .row{border:none}.dt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}.dl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.dl.tt{border-top:1px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}

<script>
var NID=1,MENU=[],CF=null,cart={},orders=[],hist=[],seq=1,cat="Todos",EID=0,SENDING=false,REMOVE_PRODUCT_IMAGE=false,IMAGE_PREVIEW_URL=null;
var $=function(i){return document.getElementById(i)},pd=$("pd");
var money=function(v){return "R$ "+v.toFixed(2).replace(".",",")};
async function api(path,options){var r=await fetch(path,options||{}),data=await r.json();if(!r.ok)throw new Error(data.erro||"Falha ao comunicar com o servidor.");return data}
function pedidoFromApi(o){o.t=new Date(String(o.t).replace(" ","T"));return o}
async function loadData(){var data=await api("/api/dados");MENU=data.produtos;orders=data.pedidos.map(pedidoFromApi);hist=[];NID=MENU.reduce(function(n,m){return Math.max(n,m.id+1)},1);seq=orders.reduce(function(n,o){return Math.max(n,o.id+1)},1)}
async function loadProducts(){var data=await api("/api/produtos");MENU=data.produtos;NID=MENU.reduce(function(n,m){return Math.max(n,m.id+1)},1)}
async function startApp(){try{await loadData();drawCats();drawGrid();drawHist();hdr()}catch(e){console.error(e);toast("Erro ao carregar o banco: "+e.message)}}
function P(id){return MENU.filter(function(m){return m.id==id})[0]}
function cartStorageKey(){return AUTH?"da-lanches-cart:"+AUTH.station_id:null}
function saveCart(){var key=cartStorageKey();if(!key)return;try{if(Object.keys(cart).length)localStorage.setItem(key,JSON.stringify(cart));else localStorage.removeItem(key)}catch(error){console.error(error);toast("Não foi possível salvar o pedido neste aparelho.")}}
function restoreCart(){var key=cartStorageKey();if(!key)return;try{var saved=localStorage.getItem(key);if(!saved)return;var parsed=JSON.parse(saved),restored={};Object.keys(parsed).forEach(function(id){var product=P(id),quantity=Number(parsed[id]);if(!product||!product.on||product.p==null||!Number.isInteger(quantity)||quantity<1)return;if(product.e!=null)quantity=Math.min(quantity,product.e);if(quantity>0)restored[id]=quantity});cart=restored;saveCart();if(Object.keys(cart).length)toast("Pedido em andamento restaurado.")}catch(error){console.error(error);toast("Não foi possível restaurar o pedido salvo.")}}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},1600)}
async function go(n){[1,3,4].forEach(function(i){$("v"+i).className="view"+(n==i?" on":"");$("t"+i).className=n==i?"on":""});$("bar").style.display=n==1?"flex":"none";if(n==1){try{await loadProducts();drawCats();sum()}catch(e){console.error(e);toast("Erro ao atualizar cardápio: "+e.message)}}if(n==3)drawHist();if(n==4)drawProds()}
function cats(){var c=["Todos"];MENU.forEach(function(m){if(m.on&&c.indexOf(m.c)<0)c.push(m.c)});return c}
function allcats(){var c=[];MENU.forEach(function(m){if(c.indexOf(m.c)<0)c.push(m.c)});return c}
function drawCats(){var c=cats();if(c.indexOf(cat)<0)cat="Todos";$("cats").innerHTML=c.map(function(x){return '<button class="'+(x==cat?"on":"")+'" data-c="'+x+'" onclick="setCat(this.dataset.c)">'+(x=="Todos"?"🍴":(EM[x]||"🍽️"))+' '+x+'</button>'}).join("")}
function setCat(c){cat=c;drawCats();drawGrid()}
function drawGrid(){$("grid").innerHTML=MENU.filter(function(m){return m.on&&(cat=="Todos"||m.c==cat)&&m.n.toLowerCase().indexOf($("sr").value.toLowerCase())>=0}).map(function(m){var q=cart[m.id]||0,hs=m.e!=null,left=hs?m.e-q:0,noPrice=m.p==null;return '<div class="item'+(q?' has':'')+'"><div class="top"><div class="tile" style="background:'+cc(m.c)+'33">'+(m.img?'<img src="'+m.img+'" alt="" loading="lazy">':em(m))+'</div><div class="pv">'+(noPrice?'Preço a definir':money(m.p))+'</div></div><div><div class="ct">'+m.c+'</div><b>'+m.n+'</b><div class="ds">'+(m.d||"")+'</div></div><div>'+(noPrice?'<span class="stk lo">Defina o preço para vender</span>':hs?(left<=0?'<span class="stk no">Esgotado</span>':left<=5?'<span class="stk lo">Estoque baixo: restam '+left+'</span>':'<span class="stk ok">'+left+' em estoque</span>'):'<span class="stk ok">Disponível</span>')+'<div class="st"><button onclick="chg('+m.id+',-1)"'+(q?'':' disabled')+'>−</button><b>'+q+'</b><button class="p" onclick="chg('+m.id+',1)"'+(noPrice||hs&&left<=0?' disabled':'')+'>+</button></div></div></div>'}).join("")}
function chg(id,d){var pm=P(id);if(d>0&&pm.p==null){toast("Defina o preço do produto antes de vender");return}if(d>0&&pm.e!=null&&(cart[id]||0)>=pm.e){toast("Sem estoque");return}cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];saveCart();sum()}
function total(){return Object.keys(cart).reduce(function(s,i){return s+P(i).p*cart[i]},0)}
function count(){return Object.keys(cart).reduce(function(s,i){return s+cart[i]},0)}
function sum(){$("n").textContent=count()+(count()==1?" item":" itens");$("tot").textContent=money(total());$("rev").disabled=!count();drawGrid()}
var CC={"Pastéis":"#e0a21b","Coxinhas":"#e8883a","Pizzas":"#d9503f","Bebidas":"#3a9ad9"},EM={"Pastéis":"🥟","Coxinhas":"🍗","Pizzas":"🍕","Bebidas":"🥤"};
function cc(c){return CC[c]||"#9a8a6a"}function em(m){return m.n.indexOf("Suco")==0?"🍊":(EM[m.c]||"🍽️")}
var EX=null,BT=null,BC=null,SV=["000018f0-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000fee7-0000-1000-8000-00805f9b34fb"];
function tgl(id){EX=EX==id?null:id;drawHist()}

async function refreshAppData(silent){
if(SENDING){toast("Aguarde a impressão terminar antes de atualizar.");return}
if(REFRESHING)return;
REFRESHING=true;
var refreshButton=$("refreshDataButton");
if(refreshButton){refreshButton.disabled=true;refreshButton.textContent="Atualizando dados..."}
try{
var activeView=document.querySelector(".view.on"),activeTab=activeView?Number(activeView.id.slice(1)):1;
await loadData();
if(activeTab===1||activeTab===4)await loadProducts();
Object.keys(cart).forEach(function(id){
var product=P(id);
if(!product||product.p==null){delete cart[id];return}
if(product.e!=null&&cart[id]>product.e)cart[id]=product.e;
if(cart[id]<=0)delete cart[id]
});
saveCart();
drawCats();drawGrid();drawHist();hdr();sum();
if(activeTab===5)await loadAdminSummary();
if(!silent)toast(" impressora continua conectada.")
}catch(error){
console.error(error);
toast("Não foi possível atualizar os dados: "+error.message)
}finally{
REFRESHING=false;
if(refreshButton){refreshButton.disabled=false;refreshButton.textContent="↻ Atualizar dados (sem desconectar)"}
}
}

function setPrinterButton(connected,reconnecting){
var button=$("pb");
button.className="pbtn"+(connected?" on":"");
button.textContent=connected?"🖨️ Impressora conectada":reconnecting?"🖨️ Reconectando...":"🖨️ Conectar impressora";
button.title=connected?"Impressora conectada":reconnecting?"Reconectando à impressora":"Conectar impressora";
button.setAttribute("aria-label",button.title);
button.setAttribute("aria-pressed",connected?"true":"false")
}
async function connectPrinterDevice(device){
var server=await device.gatt.connect(),services=await server.getPrimaryServices(),channel=null;
for(var i=0;i<services.length&&!channel;i++){
var characteristics=await services[i].getCharacteristics();
for(var j=0;j<characteristics.length;j++){
if(characteristics[j].properties.write||characteristics[j].properties.writeWithoutResponse){channel=characteristics[j];break}
}
}
if(!channel){if(device.gatt.connected)device.gatt.disconnect();throw new Error("Não achei canal de impressão nesta impressora.")}
BT=device;BC=channel;setPrinterButton(true);
if(!PRINTER_LISTENERS.has(device)){
device.addEventListener("gattserverdisconnected",function(){
if(BT===device){BC=null;setPrinterButton(false)}
});
PRINTER_LISTENERS.add(device)
}
return true
}
function beginPrinterConnection(device){
PRINTER_CONNECT_PROMISE=connectPrinterDevice(device).finally(function(){PRINTER_CONNECT_PROMISE=null});
return PRINTER_CONNECT_PROMISE
}
async function restorePrinter(){
if(!AUTH||!navigator.bluetooth||!navigator.bluetooth.getDevices)return false;
var saved=localStorage.getItem("da-lanches-printer:"+AUTH.station_id);
if(!saved)return false;
try{
for(var attempt=0;attempt<3;attempt++){
var known=await navigator.bluetooth.getDevices(),device=known.find(function(item){return item.id===saved});
if(device){
try{return await beginPrinterConnection(device)}
catch(error){
if(attempt===2)throw error
}
}
if(attempt<2)await new Promise(function(resolve){setTimeout(resolve,500*(attempt+1))})
}
setPrinterButton(false);
toast("Sessão iniciada. Toque em Conectar impressora para reconectar.");
return false
}catch(error){
console.warn("Impressora salva não reconectou automaticamente:",error);
setPrinterButton(false);
toast("Não reconectou automaticamente. Toque em Conectar impressora.");
return false
}
}
btConn=async function(){
if(BC){
if(BT&&BT.gatt.connected)BT.gatt.disconnect();
BC=null;BT=null;setPrinterButton(false);
return false
}
if(PRINTER_CONNECT_PROMISE)return PRINTER_CONNECT_PROMISE;
if(!navigator.bluetooth){toast("Este navegador não oferece Bluetooth para impressão.");return false}
var key="da-lanches-printer:"+AUTH.station_id,saved=localStorage.getItem(key);
try{
var device=null;
if(saved&&navigator.bluetooth.getDevices){
var known=await navigator.bluetooth.getDevices();
device=known.find(function(item){return item.id===saved})||null
}
if(!device)device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});
var connected=await beginPrinterConnection(device);
localStorage.setItem(key,device.id);
toast(saved&&device.id!==saved?"Impressora desta estação atualizada":"Impressora conectada");
return connected
}catch(error){setPrinterButton(false);toast("Não conectou: "+(error.message||error));return false}
};
async function send(){
if(!count()||SENDING)return;
SENDING=true;$("rev").disabled=true;$("rev").textContent="Salvando pedido...";
var order=null;
try{
if(!BC){var connected=await btConn();if(!connected||!BC)return}
var result=await api("/api/pedidos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({itens:Object.keys(cart).map(function(i){return{id:Number(i),q:cart[i]}})})});
order=pedidoFromApi(result.pedido);orders.unshift(order);seq=Math.max(seq,order.id+1);
Object.keys(cart).forEach(function(i){var product=P(i);if(product&&product.e!=null)product.e=Math.max(0,product.e-cart[i])});
cart={};saveCart();sum();hdr();drawHist();$("rev").textContent="Iniciando impressão...";
try{await api("/api/pedidos/"+order.id+"/impressao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"imprimindo"})});order.impressao_status="imprimindo"}
catch(error){toast("Pedido salvo, mas não iniciou a impressão: "+error.message);return}
var printed=await btPrint(ticketText(order,false));
try{await api("/api/pedidos/"+order.id+"/impressao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:printed?"impresso":"falhou"})});order.impressao_status=printed?"impresso":"falhou"}
catch(error){toast("Confira a impressora: não foi possível confirmar o resultado ("+error.message+").")}
drawHist()
}catch(error){console.error(error);toast(order?"Pedido salvo; confira a impressão: "+error.message:"Erro ao salvar pedido: "+error.message)}
finally{SENDING=false;$("rev").textContent="🖨️ Imprimir pedido";$("rev").disabled=!count()}
}
